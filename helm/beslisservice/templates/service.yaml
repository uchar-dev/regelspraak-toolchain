apiVersion: v1
kind: Service
metadata:
  name: {{ include "beslisservice.fullname" . }}
  labels:
    {{- include "beslisservice.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "beslisservice.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
