apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-service.fullname" . }}
  labels:
    {{- include "decision-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "decision-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "decision-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: decision-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: ALLOW_MARKERS
              value: {{ .Values.allowMarkers | quote }}
            {{- if .Values.descriptor }}
            - name: DESCRIPTOR
              value: {{ .Values.descriptor | quote }}
            {{- end }}
            {{- if .Values.sourcesManifest }}
            - name: SOURCES_MANIFEST
              value: {{ .Values.sourcesManifest | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          # Rule compilation happens BEFORE the port binds, so a slow first bind is
          # normal startup, not a hang. The startupProbe grants up to ~10 min
          # (5s × 120) for compilation before readiness/liveness take over.
          startupProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
