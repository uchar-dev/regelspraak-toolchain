# The Quarkus HTTP port is driven by the SAME PORT env var the shell/Helm launcher uses (default 8080), so
# existing Helm values apply unchanged. DESCRIPTOR / SOURCES_MANIFEST / ALLOW_MARKERS are read natively as env
# vars by the @ConfigProperty injections in KernProducer (no mapping needed — Quarkus reads env vars directly).
quarkus.http.port=${PORT:8080}

# SmallRye Health serves /q/health/live and /q/health/ready automatically; no extra config required.
# Keep the banner off in container logs.
quarkus.banner.enabled=false
